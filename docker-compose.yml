# Fejlesztői adatbázis:          docker compose up -d db
# Teljes stack (db + migráció + API): docker compose --profile api up --build
services:
  db:
    image: postgres:16-alpine
    container_name: szokartya-db
    environment:
      POSTGRES_USER: szokartya
      POSTGRES_PASSWORD: szokartya
      POSTGRES_DB: szokartya
      # UTF-8 kódolás a német (ä, ö, ü, ß) és magyar (ő, ű) karakterekhez
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U szokartya -d szokartya"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Egyszeri: migrációk + idempotens seed, utána kilép.
  migrate:
    profiles: [api]
    build:
      context: ./backend
      target: build
    environment:
      DATABASE_URL: postgresql://szokartya:szokartya@db:5432/szokartya?schema=public
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [api]
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://szokartya:szokartya@db:5432/szokartya?schema=public
      # Csak helyi bemutatóhoz! Éles környezetben véletlen, titkos érték kell.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-demo-secret-change-me-0123456789abcdef}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
